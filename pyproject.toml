[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolozu"
dynamic = ["version"]
description = "Interface-contract-first evaluation toolkit for mitigating catastrophic forgetting and domain shift via reproducible workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "YOLOZU contributors" }]
keywords = [
  "computer-vision",
  "object-detection",
  "segmentation",
  "pose-estimation",
  "tensorrt",
  "onnx",
  "onnxruntime",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["PyYAML>=6.0", "numpy>=1.24", "Pillow>=10.0", "typing_extensions>=4.8; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/ToppyMicroServices/YOLOZU"
Repository = "https://github.com/ToppyMicroServices/YOLOZU"
Issues = "https://github.com/ToppyMicroServices/YOLOZU/issues"
Changelog = "https://github.com/ToppyMicroServices/YOLOZU/blob/main/CHANGELOG.md"

[project.optional-dependencies]
demo = [
  "torch>=2.1",
  "torchvision>=0.16",
  "timm>=0.9",
  "opencv-python>=4.8",
  "transformers>=4.38",
  "huggingface-hub>=0.20",
  "safetensors>=0.4",
]
onnxrt = ["onnx>=1.14", "onnxruntime>=1.17"]
train = ["torch>=2.1", "torchvision>=0.16", "onnx>=1.14", "onnxruntime>=1.17", "onnxscript>=0.1", "safetensors>=0.4"]
coco = ["pycocotools>=2.0.7"]
mcp = ["mcp>=1.0.0"]
actions = ["fastapi>=0.110", "uvicorn>=0.30", "pydantic>=2.0"]

# Tools / integrations (optional)
opencv = ["opencv-python>=4.8"]
viz = ["matplotlib>=3.8"]

# Config import adapters (optional)
mmdet = ["mmengine"]
detectron2 = ["detectron2"]
yolox = ["yolox"]

# Local development / testing (optional)
test = ["pytest>=7.0", "torch>=2.1", "torchvision>=0.16", "onnx>=1.14", "onnxruntime>=1.17", "onnxscript>=0.1"]
dev = ["pytest>=7.0", "torch>=2.1", "torchvision>=0.16", "onnx>=1.14", "onnxruntime>=1.17", "onnxscript>=0.1", "ruff>=0.5"]

# Everything in the docs install list (demo/onnxrt/train/coco/mcp/actions)
full = [
  "torch>=2.1",
  "torchvision>=0.16",
  "timm>=0.9",
  "opencv-python>=4.8",
  "transformers>=4.38",
  "huggingface-hub>=0.20",
  "onnx>=1.14",
  "onnxruntime>=1.17",
  "onnxscript>=0.1",
  "safetensors>=0.4",
  "pycocotools>=2.0.7",
  "mcp>=1.0.0",
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "pydantic>=2.0",
]

[project.scripts]
yolozu = "yolozu.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "yolozu.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["yolozu*", "rtdetr_pose*"]

[tool.setuptools.package-data]
"yolozu.data" = [
  "configs/*.json",
  "configs/*.yaml",
  "configs/*.yml",
  "configs/continual/*.yaml",
  "configs/continual/*.yml",
  "manifest/*.json",
  "manifest/*.md",
  "protocols/*.json",
  "schemas/*.json",
  "docs/*.md",
]
"rtdetr_pose" = ["configs/*.json"]

[tool.ruff]
# Exclude common directories
exclude = [
    ".git",
    ".ruff_cache",
    "__pycache__",
]

[tool.ruff.lint]
# Ignore E402 (module level import not at top of file) for tools and test files
# These files intentionally modify sys.path before importing local modules
[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"]
"rtdetr_pose/tools/*.py" = ["E402"]
"rtdetr_pose/tests/*.py" = ["E402"]
"tests/*.py" = ["E402"]
