# Detectron2 finetune smoke template for YOLOZU.
#
# This file is designed for Detectron2's default config plus a launcher that
# registers the selected COCO dataset before constructing DefaultTrainer.

MODEL:
  DEVICE: "cpu"
  WEIGHTS: ""
  ROI_HEADS:
    NUM_CLASSES: 2

SOLVER:
  IMS_PER_BATCH: 1
  BASE_LR: 0.00025
  MAX_ITER: 1
  STEPS: []
  CHECKPOINT_PERIOD: 1

INPUT:
  MIN_SIZE_TRAIN: (64,)
  MAX_SIZE_TRAIN: 64
  MIN_SIZE_TEST: 64
  MAX_SIZE_TEST: 64

DATALOADER:
  NUM_WORKERS: 0

OUTPUT_DIR: "runs/external_finetune/detectron2_smoke"
