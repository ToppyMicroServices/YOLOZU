# Detectron2 finetune smoke template for YOLOZU.
#
# This file is designed for detectron2/tools/train_net.py style runners.
# Dataset registration is user/environment specific; set DATASETS.TRAIN/TEST via
# command line overrides or project trainer script.

_BASE_: "detectron2://COCO-Detection/faster_rcnn_R_50_FPN_1x.yaml"

MODEL:
  WEIGHTS: ""
  ROI_HEADS:
    NUM_CLASSES: 80

SOLVER:
  IMS_PER_BATCH: 2
  BASE_LR: 0.00025
  MAX_ITER: 50
  STEPS: []

INPUT:
  MIN_SIZE_TRAIN: (640,)
  MAX_SIZE_TRAIN: 640

DATALOADER:
  NUM_WORKERS: 0

OUTPUT_DIR: "runs/external_finetune/detectron2_smoke"
