name: Bug report
description: Report a reproducible failure outside the first-run path
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use the first-run form for install, doctor, demo, or first-evaluation failures.
        GitHub Issues are public. Remove private data before posting, and use SECURITY.md for a possible vulnerability.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What documented workflow were you trying to complete?
    validations:
      required: true
  - type: dropdown
    id: source_framework
    attributes:
      label: Source framework
      options:
        - Ultralytics
        - Detectron2
        - MMDetection
        - YOLOX
        - Hugging Face
        - YOLOZU RT-DETR
        - Other or custom
        - Not applicable
    validations:
      required: true
  - type: input
    id: source_framework_version
    attributes:
      label: Source framework version
      description: Include the public release, version range, or commit. Use "Not applicable" when appropriate.
      placeholder: framework version, commit SHA, or Not applicable
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste sanitized `yolozu doctor --output -` output, or list OS, Python, YOLOZU, install method, and CPU/GPU/runtime details.
      render: text
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands and observed output
      description: Provide the smallest sanitized command sequence and exact error. Replace private paths and names.
      render: shell
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Non-security impact and workaround
      description: State what is blocked, whether the stable validation/evaluation lane is affected, and any safe workaround. Do not include vulnerability details.
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Sanitized artifacts
      description: Link only public, minimal reproductions or paste a sanitized report excerpt/checksum. Do not upload proprietary artifacts. Enter "None" when unavailable.
      placeholder: Public reproduction URL, sanitized excerpt, checksum, or None
    validations:
      required: true
  - type: dropdown
    id: aggregate_consent
    attributes:
      label: Aggregate-use and public-citation consent
      description: Monthly reviews do not copy issue text or identity fields. If you allow citation, the review may link this already-public Issue URL, which exposes its public author and content.
      options:
        - "Yes — count this item and allow its public Issue URL to be cited"
        - "Count only — include it in totals without an individual Issue link"
        - "No — exclude this item from aggregate totals"
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Public-data and follow-up consent
      options:
        - label: I confirm that this public report contains no confidential, personal, credential, or security-sensitive data.
          required: true
        - label: I consent to maintainers asking follow-up questions in this public issue.
          required: true
