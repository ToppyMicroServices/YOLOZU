name: gpu-ngc

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  check_runner:
    runs-on: ubuntu-latest
    outputs:
      has_runner: ${{ steps.chk.outputs.has_runner }}
    steps:
      - name: Check self-hosted runner availability
        id: chk
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUIRED_LABEL: gpu
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}/actions/runners?per_page=100"
          echo "Checking runners via ${api} ..."

          resp="$(curl -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -w $'\n%{http_code}' \
            "${api}" || true)"
          body="${resp%$'\n'*}"
          code="${resp##*$'\n'}"

          if [[ "${code}" != "200" ]]; then
            echo "Runner API returned HTTP ${code}; skipping GPU job."
            echo "has_runner=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ -n "${REQUIRED_LABEL}" ]]; then
            cnt="$(echo "${body}" | jq -r --arg L "${REQUIRED_LABEL}" '
              [.runners[]
                | select(.status=="online")
                | select(.busy==false)
                | select(any(.labels[]?; .name==$L))
              ] | length')"
          else
            cnt="$(echo "${body}" | jq -r '
              [.runners[]
                | select(.status=="online")
                | select(.busy==false)
              ] | length')"
          fi

          if [[ "${cnt}" -gt 0 ]]; then
            echo "Found ${cnt} eligible runner(s)."
            echo "has_runner=true" >> "${GITHUB_OUTPUT}"
          else
            echo "No eligible runners (online+idle). Skipping GPU job."
            echo "has_runner=false" >> "${GITHUB_OUTPUT}"
          fi

  trt_and_opencv_cuda:
    needs: check_runner
    if: ${{ needs.check_runner.outputs.has_runner == 'true' && secrets.NGC_API_KEY != '' }}
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Login to NVIDIA NGC (nvcr.io)
        uses: docker/login-action@v3
        with:
          registry: nvcr.io
          username: $oauthtoken
          password: ${{ secrets.NGC_API_KEY }}

      - name: Sanity (GPU visible)
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          docker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi

      - name: TensorRT smoke (engine build + load)
        shell: bash
        run: |
          set -euo pipefail
          docker pull nvcr.io/nvidia/tensorrt:24.08-py3
          docker run --rm --gpus all \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            nvcr.io/nvidia/tensorrt:24.08-py3 \
            bash -lc '
              set -euo pipefail
              python3 --version
              nvidia-smi
              python3 -m pip install --upgrade pip
              python3 -m pip install --no-cache-dir numpy onnx

              out_dir="reports/ci_trt_smoke"
              mkdir -p "${out_dir}"
              onnx_path="${out_dir}/model.onnx"
              engine_path="${out_dir}/model_fp16.plan"
              meta_path="${out_dir}/engine.meta.json"

              python3 - <<PY
              import onnx
              from onnx import helper, TensorProto

              X = helper.make_tensor_value_info("images", TensorProto.FLOAT, [1, 3, 64, 64])
              Y = helper.make_tensor_value_info("output0", TensorProto.FLOAT, [1, 3, 64, 64])
              node = helper.make_node("Identity", inputs=["images"], outputs=["output0"])
              graph = helper.make_graph([node], "identity_graph", [X], [Y])
              model = helper.make_model(graph, opset_imports=[helper.make_operatorsetid("", 18)])
              onnx.save(model, "'"${onnx_path}"'")
              print("wrote", "'"${onnx_path}"'")
              PY

              python3 tools/build_trt_engine.py \
                --onnx "${onnx_path}" \
                --engine "${engine_path}" \
                --precision fp16 \
                --input-name images \
                --min-shape 1x3x64x64 \
                --opt-shape 1x3x64x64 \
                --max-shape 1x3x64x64 \
                --meta-output "${meta_path}"

              trtexec --loadEngine="${engine_path}" --shapes=images:1x3x64x64 --iterations=1 --warmUp=0 > "${out_dir}/trtexec_load.log"
              ls -la "${out_dir}"
            '

      # Notes:
      # - REQUIRED_LABEL="gpu" avoids accidentally using CPU-only runners.
      # - For org-level runners not visible via repo API, this check may need to use /orgs/{org}/actions/runners.
