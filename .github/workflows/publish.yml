name: publish

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions: read-all

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate release tag matches package version
        if: ${{ github.event_name == 'release' }}
        run: |
          python - <<'PY'
          import pathlib
          import re

          tag = "${{ github.event.release.tag_name }}"
          expected = tag[1:] if tag.startswith("v") else tag
          source = pathlib.Path("yolozu/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', source)
          if not match:
            raise SystemExit("Could not parse __version__ from yolozu/__init__.py")
          package_version = match.group(1)
          if package_version != expected:
            raise SystemExit(
              f"Release tag/version mismatch: tag={tag} expected={expected} package={package_version}"
            )
          print(f"release tag matches package version: {package_version}")
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python3 tools/ci/install_with_hashes.py --requirements requirements-build.lock
          python -m build
          python -m twine check dist/*

      - name: Validate built wheel version matches package version (and release tag)
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import glob
          import os
          import pathlib
          import re
          import zipfile

          source = pathlib.Path("yolozu/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', source)
          if not match:
            raise SystemExit("Could not parse __version__ from yolozu/__init__.py")
          package_version = match.group(1)

          wheels = sorted(glob.glob("dist/*.whl"))
          if not wheels:
            raise SystemExit("no wheels found under dist/")
          whl = wheels[-1]

          with zipfile.ZipFile(whl, "r") as z:
            meta = None
            for name in z.namelist():
              if name.endswith(".dist-info/METADATA"):
                meta = z.read(name).decode("utf-8", errors="replace")
                break
          if not meta:
            raise SystemExit(f"wheel METADATA not found: {whl}")
          m = re.search(r"^Version:\\s*(.+)$", meta, re.MULTILINE)
          if not m:
            raise SystemExit(f"wheel Version field not found in METADATA: {whl}")
          wheel_version = m.group(1).strip()

          if wheel_version != package_version:
            raise SystemExit(
              f"wheel/package version mismatch: wheel={wheel_version} package={package_version} whl={whl}"
            )

          tag = (os.environ.get(\"RELEASE_TAG\") or \"\").strip()
          if tag:
            expected = tag[1:] if tag.startswith(\"v\") else tag
            if wheel_version != expected:
              raise SystemExit(
                f\"wheel/tag version mismatch: tag={tag} expected={expected} wheel={wheel_version} whl={whl}\"
              )

          print(f\"wheel version OK: {wheel_version} ({whl})\")
          PY

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
