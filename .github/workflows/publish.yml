name: publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      expected_version:
        description: Version expected in yolozu/__init__.py and CHANGELOG.md (for recovery/manual publish).
        required: true
        type: string
      release_tag:
        description: Optional tag to validate against (for example v4.3.1).
        required: false
        type: string

permissions: read-all

concurrency:
  group: publish-${{ github.event.release.tag_name || github.event.inputs.release_tag || github.event.inputs.expected_version || github.run_id }}
  cancel-in-progress: false

jobs:
  macos_wheel_check:
    name: macOS wheel build check
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Build wheel only
        run: |
          python3 tools/ci/install_with_hashes.py --requirements requirements-locks/requirements-build.lock
          python -m build --wheel
          python -m twine check dist/*.whl

      - name: Validate built wheel version matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
          EXPECTED_VERSION_INPUT: ${{ github.event.inputs.expected_version }}
        run: |
          python - <<'PY'
          import glob
          import os
          import pathlib
          import re
          import zipfile

          source = pathlib.Path("yolozu/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', source)
          if not match:
            raise SystemExit("Could not parse __version__ from yolozu/__init__.py")
          package_version = match.group(1)

          wheels = sorted(glob.glob("dist/*.whl"))
          if not wheels:
            raise SystemExit("no wheels found under dist/")
          whl = wheels[-1]

          with zipfile.ZipFile(whl, "r") as z:
            meta = None
            for name in z.namelist():
              if name.endswith(".dist-info/METADATA"):
                meta = z.read(name).decode("utf-8", errors="replace")
                break
          if not meta:
            raise SystemExit(f"wheel METADATA not found: {whl}")
          m = re.search(r"^Version:\s*(.+)$", meta, re.MULTILINE)
          if not m:
            raise SystemExit(f"wheel Version field not found in METADATA: {whl}")
          wheel_version = m.group(1).strip()

          if wheel_version != package_version:
            raise SystemExit(
              f"wheel/package version mismatch: wheel={wheel_version} package={package_version} whl={whl}"
            )

          tag = (os.environ.get("RELEASE_TAG") or "").strip()
          if tag:
            expected = tag[1:] if tag.startswith("v") else tag
            if wheel_version != expected:
              raise SystemExit(
                f"wheel/tag version mismatch: tag={tag} expected={expected} wheel={wheel_version} whl={whl}"
              )

          expected_input = (os.environ.get("EXPECTED_VERSION_INPUT") or "").strip()
          if expected_input and wheel_version != expected_input:
            raise SystemExit(
              f"wheel/manual version mismatch: expected={expected_input} wheel={wheel_version} whl={whl}"
            )

          print(f"macOS wheel version OK: {wheel_version} ({whl})")
          PY

  pypi:
    needs:
      - macos_wheel_check
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Validate version and changelog alignment
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
          EXPECTED_VERSION_INPUT: ${{ github.event.inputs.expected_version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          source = pathlib.Path("yolozu/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', source)
          if not match:
            raise SystemExit("Could not parse __version__ from yolozu/__init__.py")
          package_version = match.group(1)

          tag = (os.environ.get("RELEASE_TAG") or "").strip()
          expected_input = (os.environ.get("EXPECTED_VERSION_INPUT") or "").strip()

          if expected_input and package_version != expected_input:
            raise SystemExit(
              f"Manual publish/version mismatch: expected={expected_input} package={package_version}"
            )

          if tag:
            expected = tag[1:] if tag.startswith("v") else tag
            if package_version != expected:
              raise SystemExit(
                f"Release tag/version mismatch: tag={tag} expected={expected} package={package_version}"
              )

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = f"## [{package_version}] - "
          if heading not in changelog:
            raise SystemExit(f"CHANGELOG.md missing release heading: {heading}YYYY-MM-DD")

          print(f"package version + changelog OK: {package_version}")
          PY

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python3 tools/ci/install_with_hashes.py --requirements requirements-locks/requirements-build.lock
          python -m build
          python -m twine check dist/*

      - name: Validate built wheel version matches package version (and release tag)
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
          EXPECTED_VERSION_INPUT: ${{ github.event.inputs.expected_version }}
        run: |
          python - <<'PY'
          import glob
          import os
          import pathlib
          import re
          import zipfile

          source = pathlib.Path("yolozu/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', source)
          if not match:
            raise SystemExit("Could not parse __version__ from yolozu/__init__.py")
          package_version = match.group(1)

          wheels = sorted(glob.glob("dist/*.whl"))
          if not wheels:
            raise SystemExit("no wheels found under dist/")
          whl = wheels[-1]

          with zipfile.ZipFile(whl, "r") as z:
            meta = None
            for name in z.namelist():
              if name.endswith(".dist-info/METADATA"):
                meta = z.read(name).decode("utf-8", errors="replace")
                break
          if not meta:
            raise SystemExit(f"wheel METADATA not found: {whl}")
          m = re.search(r"^Version:\s*(.+)$", meta, re.MULTILINE)
          if not m:
            raise SystemExit(f"wheel Version field not found in METADATA: {whl}")
          wheel_version = m.group(1).strip()

          if wheel_version != package_version:
            raise SystemExit(
              f"wheel/package version mismatch: wheel={wheel_version} package={package_version} whl={whl}"
            )

          tag = (os.environ.get("RELEASE_TAG") or "").strip()
          if tag:
            expected = tag[1:] if tag.startswith("v") else tag
            if wheel_version != expected:
              raise SystemExit(
                f"wheel/tag version mismatch: tag={tag} expected={expected} wheel={wheel_version} whl={whl}"
              )

          expected_input = (os.environ.get("EXPECTED_VERSION_INPUT") or "").strip()
          if expected_input and wheel_version != expected_input:
            raise SystemExit(
              f"wheel/manual version mismatch: expected={expected_input} wheel={wheel_version} whl={whl}"
            )

          print(f"wheel version OK: {wheel_version} ({whl})")
          PY

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
