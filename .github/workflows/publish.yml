name: publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      expected_version:
        description: Version expected across package, CHANGELOG.md, CITATION.cff, and current manifest examples (for recovery/manual publish).
        required: true
        type: string
      release_tag:
        description: Optional tag to validate against (for example v4.3.1).
        required: false
        type: string

permissions: read-all

concurrency:
  group: publish-${{ github.event.release.tag_name || github.event.inputs.release_tag || github.event.inputs.expected_version || github.run_id }}
  cancel-in-progress: false

jobs:
  macos_wheel_check:
    name: macOS wheel build check
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Validate adaptive vision roadmap projection
        run: |
          python3 tools/generate_adaptive_vision_roadmap.py --check --json
          python3 -m unittest \
            tests.test_adaptive_vision_roadmap_generator \
            tests.test_adaptive_evidence_activation \
            tests.test_adaptive_environment_profile \
            tests.test_adaptive_bundle_registry \
            tests.test_adaptive_algorithm_scout \
            tests.test_adaptive_candidate_screening \
            tests.test_adaptive_support_profile_governance \
            tests.test_adaptive_lifecycle_governance \
            tests.test_adaptive_managed_output \
            tests.test_adaptive_recommendation \
            tests.test_adaptive_processing \
            tests.test_adaptive_routing_e2e \
            tests.test_adaptive_selector \
            tests.test_adaptive_selection_contracts \
            tests.test_adaptive_qualification -v

      - name: Build wheel only
        run: |
          python3 tools/ci/install_with_hashes.py --requirements requirements-locks/requirements-build.lock
          python -m build --wheel
          python -m twine check dist/*.whl

      - name: Validate adaptive vision roadmap wheel resources
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = sorted(glob.glob("dist/*.whl"))
          if not wheels:
            raise SystemExit("no wheels found under dist/")
          required = {
            "yolozu/data/manifest/adaptive_vision_roadmap.json",
            "yolozu/data/schemas/adaptive_vision_roadmap.schema.json",
            "yolozu/data/schemas/algorithm_scout_sources.schema.json",
            "yolozu/data/schemas/algorithm_scout_report.schema.json",
            "yolozu/data/schemas/local_artifact_inventory.schema.json",
            "yolozu/data/schemas/qualification_report.schema.json",
            "yolozu/data/schemas/evidence_activation_record.schema.json",
            "yolozu/data/schemas/candidate_screening_record.schema.json",
            "yolozu/data/schemas/candidate_isolation_probe.schema.json",
            "yolozu/data/schemas/screening_eligibility_observation.schema.json",
            "yolozu/data/schemas/support_profile_spec.schema.json",
            "yolozu/data/schemas/support_profile_record.schema.json",
            "yolozu/data/schemas/support_profile_eligibility_observation.schema.json",
            "yolozu/data/schemas/support_profile_set_proposal.schema.json",
            "yolozu/data/schemas/lifecycle_rollback_bindings.schema.json",
            "yolozu/data/schemas/selection_decision.schema.json",
            "yolozu/data/adaptive_routing/bundle_specs.json",
            "yolozu/data/adaptive_routing/bundle_lifecycle.jsonl",
            "yolozu/data/adaptive_routing/candidate_screening.jsonl",
            "yolozu/data/adaptive_routing/support_profiles.jsonl",
            "yolozu/data/adaptive_routing/evidence_activation.jsonl",
          }
          with zipfile.ZipFile(wheels[-1], "r") as archive:
            missing = sorted(required - set(archive.namelist()))
          if missing:
            raise SystemExit(f"adaptive vision roadmap wheel resources missing: {missing}")
          print(f"adaptive vision roadmap wheel resources OK: {wheels[-1]}")
          PY

      - name: Validate built wheel version matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
          EXPECTED_VERSION_INPUT: ${{ github.event.inputs.expected_version }}
        run: |
          python - <<'PY'
          import glob
          import os
          import pathlib
          import re
          import zipfile

          source = pathlib.Path("yolozu/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', source)
          if not match:
            raise SystemExit("Could not parse __version__ from yolozu/__init__.py")
          package_version = match.group(1)

          wheels = sorted(glob.glob("dist/*.whl"))
          if not wheels:
            raise SystemExit("no wheels found under dist/")
          whl = wheels[-1]

          with zipfile.ZipFile(whl, "r") as z:
            meta = None
            for name in z.namelist():
              if name.endswith(".dist-info/METADATA"):
                meta = z.read(name).decode("utf-8", errors="replace")
                break
          if not meta:
            raise SystemExit(f"wheel METADATA not found: {whl}")
          m = re.search(r"^Version:\s*(.+)$", meta, re.MULTILINE)
          if not m:
            raise SystemExit(f"wheel Version field not found in METADATA: {whl}")
          wheel_version = m.group(1).strip()

          if wheel_version != package_version:
            raise SystemExit(
              f"wheel/package version mismatch: wheel={wheel_version} package={package_version} whl={whl}"
            )

          tag = (os.environ.get("RELEASE_TAG") or "").strip()
          if tag:
            expected = tag[1:] if tag.startswith("v") else tag
            if wheel_version != expected:
              raise SystemExit(
                f"wheel/tag version mismatch: tag={tag} expected={expected} wheel={wheel_version} whl={whl}"
              )

          expected_input = (os.environ.get("EXPECTED_VERSION_INPUT") or "").strip()
          if expected_input and wheel_version != expected_input:
            raise SystemExit(
              f"wheel/manual version mismatch: expected={expected_input} wheel={wheel_version} whl={whl}"
            )

          print(f"macOS wheel version OK: {wheel_version} ({whl})")
          PY

  pypi:
    needs:
      - macos_wheel_check
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Validate synchronized release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
          EXPECTED_VERSION_INPUT: ${{ github.event.inputs.expected_version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from tools.release_metadata import validate_release_metadata

          root = Path.cwd()
          tag = (os.environ.get("RELEASE_TAG") or "").strip()
          expected_input = (os.environ.get("EXPECTED_VERSION_INPUT") or "").strip()
          result = validate_release_metadata(
            root,
            expected_version=expected_input or None,
            expected_tag=tag or None,
          )
          if not result["ok"]:
            raise SystemExit(
              "release metadata validation failed:\n- "
              + "\n- ".join(result["errors"])
            )
          print(
            "package + CHANGELOG.md + CITATION.cff + manifest metadata OK: "
            + result["package_version"]
          )
          PY

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Validate adaptive vision roadmap projection
        run: |
          python3 tools/generate_adaptive_vision_roadmap.py --check --json
          python3 -m unittest \
            tests.test_adaptive_vision_roadmap_generator \
            tests.test_adaptive_evidence_activation \
            tests.test_adaptive_environment_profile \
            tests.test_adaptive_bundle_registry \
            tests.test_adaptive_algorithm_scout \
            tests.test_adaptive_candidate_screening \
            tests.test_adaptive_support_profile_governance \
            tests.test_adaptive_lifecycle_governance \
            tests.test_adaptive_managed_output \
            tests.test_adaptive_recommendation \
            tests.test_adaptive_processing \
            tests.test_adaptive_routing_e2e \
            tests.test_adaptive_selector \
            tests.test_adaptive_selection_contracts \
            tests.test_adaptive_qualification -v

      - name: Build
        run: |
          python3 tools/ci/install_with_hashes.py --requirements requirements-locks/requirements-build.lock
          python -m build
          python -m twine check dist/*

      - name: Validate adaptive vision roadmap release resources
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          required = {
            "yolozu/data/manifest/adaptive_vision_roadmap.json",
            "yolozu/data/schemas/adaptive_vision_roadmap.schema.json",
            "yolozu/data/schemas/algorithm_scout_sources.schema.json",
            "yolozu/data/schemas/algorithm_scout_report.schema.json",
            "yolozu/data/schemas/local_artifact_inventory.schema.json",
            "yolozu/data/schemas/qualification_report.schema.json",
            "yolozu/data/schemas/evidence_activation_record.schema.json",
            "yolozu/data/schemas/candidate_screening_record.schema.json",
            "yolozu/data/schemas/candidate_isolation_probe.schema.json",
            "yolozu/data/schemas/screening_eligibility_observation.schema.json",
            "yolozu/data/schemas/support_profile_spec.schema.json",
            "yolozu/data/schemas/support_profile_record.schema.json",
            "yolozu/data/schemas/support_profile_eligibility_observation.schema.json",
            "yolozu/data/schemas/support_profile_set_proposal.schema.json",
            "yolozu/data/schemas/lifecycle_rollback_bindings.schema.json",
            "yolozu/data/schemas/selection_decision.schema.json",
            "yolozu/data/adaptive_routing/bundle_specs.json",
            "yolozu/data/adaptive_routing/bundle_lifecycle.jsonl",
            "yolozu/data/adaptive_routing/candidate_screening.jsonl",
            "yolozu/data/adaptive_routing/support_profiles.jsonl",
            "yolozu/data/adaptive_routing/evidence_activation.jsonl",
          }
          wheels = sorted(glob.glob("dist/*.whl"))
          sdists = sorted(glob.glob("dist/*.tar.gz"))
          if not wheels or not sdists:
            raise SystemExit("wheel and sdist are both required")
          with zipfile.ZipFile(wheels[-1], "r") as archive:
            missing_wheel = sorted(required - set(archive.namelist()))
          with tarfile.open(sdists[-1], "r:gz") as archive:
            names = archive.getnames()
          missing_sdist = sorted(
            path for path in required if not any(name.endswith("/" + path) for name in names)
          )
          if missing_wheel or missing_sdist:
            raise SystemExit(
              f"adaptive vision roadmap resources missing: wheel={missing_wheel} sdist={missing_sdist}"
            )
          print(f"adaptive vision roadmap release resources OK: {wheels[-1]}, {sdists[-1]}")
          PY

      - name: Validate built wheel version matches package version (and release tag)
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
          EXPECTED_VERSION_INPUT: ${{ github.event.inputs.expected_version }}
        run: |
          python - <<'PY'
          import glob
          import os
          import pathlib
          import re
          import zipfile

          source = pathlib.Path("yolozu/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', source)
          if not match:
            raise SystemExit("Could not parse __version__ from yolozu/__init__.py")
          package_version = match.group(1)

          wheels = sorted(glob.glob("dist/*.whl"))
          if not wheels:
            raise SystemExit("no wheels found under dist/")
          whl = wheels[-1]

          with zipfile.ZipFile(whl, "r") as z:
            meta = None
            for name in z.namelist():
              if name.endswith(".dist-info/METADATA"):
                meta = z.read(name).decode("utf-8", errors="replace")
                break
          if not meta:
            raise SystemExit(f"wheel METADATA not found: {whl}")
          m = re.search(r"^Version:\s*(.+)$", meta, re.MULTILINE)
          if not m:
            raise SystemExit(f"wheel Version field not found in METADATA: {whl}")
          wheel_version = m.group(1).strip()

          if wheel_version != package_version:
            raise SystemExit(
              f"wheel/package version mismatch: wheel={wheel_version} package={package_version} whl={whl}"
            )

          tag = (os.environ.get("RELEASE_TAG") or "").strip()
          if tag:
            expected = tag[1:] if tag.startswith("v") else tag
            if wheel_version != expected:
              raise SystemExit(
                f"wheel/tag version mismatch: tag={tag} expected={expected} wheel={wheel_version} whl={whl}"
              )

          expected_input = (os.environ.get("EXPECTED_VERSION_INPUT") or "").strip()
          if expected_input and wheel_version != expected_input:
            raise SystemExit(
              f"wheel/manual version mismatch: expected={expected_input} wheel={wheel_version} whl={whl}"
            )

          print(f"wheel version OK: {wheel_version} ({whl})")
          PY

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

      - name: Verify published release on PyPI
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
          EXPECTED_VERSION_INPUT: ${{ github.event.inputs.expected_version }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import time
          import urllib.error
          import urllib.request

          tag = (os.environ.get("RELEASE_TAG") or "").strip()
          expected_input = (os.environ.get("EXPECTED_VERSION_INPUT") or "").strip()
          version = (tag[1:] if tag.startswith("v") else tag) or expected_input
          if not version:
            source = pathlib.Path("yolozu/__init__.py").read_text(encoding="utf-8")
            match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', source)
            if not match:
              raise SystemExit("Could not determine the published version")
            version = match.group(1)

          url = f"https://pypi.org/pypi/yolozu/{version}/json"
          attempts = 12
          delay_seconds = 10
          last_error = "release metadata not available"

          for attempt in range(1, attempts + 1):
            try:
              request = urllib.request.Request(
                url,
                headers={"User-Agent": "YOLOZU publish verification"},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                payload = json.load(response)

              published_version = str(payload.get("info", {}).get("version", ""))
              package_types = {item.get("packagetype") for item in payload.get("urls", [])}
              required_types = {"bdist_wheel", "sdist"}
              if published_version == version and required_types <= package_types:
                print(f"PyPI release verified: yolozu {version} ({', '.join(sorted(package_types))})")
                break

              last_error = (
                f"version={published_version or '<missing>'}, "
                f"package_types={sorted(item for item in package_types if item)}"
              )
            except (json.JSONDecodeError, TimeoutError, urllib.error.URLError) as exc:
              last_error = f"{type(exc).__name__}: {exc}"

            if attempt == attempts:
              raise SystemExit(
                f"PyPI did not expose yolozu {version} with wheel and sdist after "
                f"{attempts} attempts: {last_error}"
              )

            print(
              f"PyPI release not visible yet (attempt {attempt}/{attempts}): "
              f"{last_error}; retrying in {delay_seconds}s"
            )
            time.sleep(delay_seconds)
          PY
