name: pytest-gpu-machine

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pytest-gpu-machine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest_cuda_smoke:
    runs-on: [machine, gpu=t4]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: GPU visible
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi

      - name: Run CUDA smoke tests
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            echo "docker not found; cannot run GPU pytest in container."
            exit 1
          fi

          image="runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04"
          docker pull "${image}"

          docker run --rm --gpus all \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            "${image}" \
            bash -lc '
              set -euo pipefail
              nvidia-smi
              python3 tools/ci/install_with_hashes.py --requirements requirements-gpu-smoke.lock --install-local-wheel
              python3 -m pytest -q tests/test_cuda_smoke_rtdetr_pose.py --tb=short --no-header
            '
