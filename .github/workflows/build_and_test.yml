name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependency tier policy:
  # - core:       hash-locked runtime deps + local wheel install (packaging + CLI smoke)
  # - docs_mcp:   hash-locked docs/MCP/Actions deps from exact top-level lock
  # - recommended: hash-locked requirements-locks/requirements-ci.lock (regression + schema/manifest gates)
  # - full:       GPU/backends in separate manual workflows
  # docs: docs/ci_dependency_tiers.md
  changes:
    name: change scope
    runs-on: ubuntu-latest
    outputs:
      full_ci: ${{ steps.filter.outputs.full_ci }}
      docs_mcp_ci: ${{ steps.filter.outputs.docs_mcp_ci }}
      manual_ci: ${{ steps.filter.outputs.manual_ci }}
      workflows_ci: ${{ steps.filter.outputs.workflows_ci }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - name: Detect change scope
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        with:
          filters: |
            full_ci:
              - 'yolozu/**'
              - '!yolozu/integrations/mcp_server.py'
              - '!yolozu/integrations/actions_api.py'
              - 'tools/**'
              - '!tools/run_mcp_server.py'
              - '!tools/run_actions_api.py'
              - '!tools/check_mcp_settings.py'
              - 'scripts/**'
              - 'rtdetr_pose/**'
              - 'tests/**'
              - '!tests/test_ai_first_mcp_surface.py'
              - '!tests/test_candidate_artifact_ai_surface.py'
              - '!tests/test_integrations_mcp_actions_parity.py'
              - '!tests/test_check_mcp_settings_tool.py'
              - '!tests/test_generated_integration_tool_reference.py'
              - 'configs/**'
              - 'data/**'
              - 'baselines/**'
              - 'requirements*.txt'
              - 'requirements*.lock'
              - 'pyproject.toml'
              - 'pytest.ini'
              - 'ruff.toml'
              - 'MANIFEST.in'
              - 'setup.py'
              - 'setup.cfg'
            docs_mcp_ci:
              - 'README.md'
              - 'Readme_jp.md'
              - 'docs/**'
              - 'reports/adaptive_vision_roadmap.md'
              - 'tools/generate_adaptive_vision_roadmap.py'
              - 'tools/run_mcp_server.py'
              - 'tools/run_actions_api.py'
              - 'tools/check_mcp_settings.py'
              - 'yolozu/integrations/mcp_server.py'
              - 'yolozu/integrations/actions_api.py'
              - 'yolozu/integrations/ai_surface.py'
              - 'yolozu/integrations/manifest_resources.py'
              - 'yolozu/integrations/mcp_cli.py'
              - 'yolozu/integrations/tool_reference.py'
              - 'yolozu/data/manifest/adaptive_vision_roadmap.json'
              - 'yolozu/data/schemas/adaptive_vision_roadmap.schema.json'
              - 'tests/test_adaptive_vision_roadmap_generator.py'
              - 'tests/test_ai_first_mcp_surface.py'
              - 'tests/test_candidate_artifact_ai_surface.py'
              - 'tests/test_installed_ai_surface.py'
              - 'tests/test_mcp_live_surface.py'
              - 'tests/test_predictions_validation_json.py'
              - 'tests/test_integrations_mcp_actions_parity.py'
              - 'tests/test_check_mcp_settings_tool.py'
              - 'tests/test_generated_integration_tool_reference.py'
            manual_ci:
              - 'manual/**'
            workflows_ci:
              - '.github/workflows/**'

  docs_meta:
    name: docs/metadata fast path
    needs:
      - changes
    if: ${{ needs.changes.outputs.full_ci != 'true' && needs.changes.outputs.docs_mcp_ci != 'true' && needs.changes.outputs.manual_ci != 'true' && needs.changes.outputs.workflows_ci != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip heavy CI for docs-only/metadata-only changes
        run: echo "No code/runtime changes detected. Heavy CI jobs are skipped."

  workflows_meta:
    name: workflows fast path (release/security regression)
    needs:
      - changes
    if: ${{ needs.changes.outputs.full_ci != 'true' && needs.changes.outputs.docs_mcp_ci != 'true' && needs.changes.outputs.manual_ci != 'true' && needs.changes.outputs.workflows_ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Release/security workflow regression tests
        run: |
          python -m unittest \
            tests.test_release_readiness_docs \
            tests.test_workflow_release_security -v

  manual_build:
    name: manual build (main.tex only)
    needs:
      - changes
    if: ${{ needs.changes.outputs.manual_ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Build manual PDF (main.tex)
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          working_directory: manual
          root_file: main.tex
          args: -pdf -interaction=nonstopmode -halt-on-error -outdir=build -jobname=yolozu_manual
          pre_compile: python3 ../tools/generate_manual_import_graphs.py

      - name: Verify manual artifact
        run: |
          test -f manual/build/yolozu_manual.pdf
          ls -lh manual/build/yolozu_manual.pdf

  docs_mcp_gate:
    name: "ci tier: docs+mcp (lightweight)"
    needs:
      - changes
    if: ${{ needs.changes.outputs.docs_mcp_ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install lightweight deps (hash-locked docs/MCP/actions set)
        run: |
          python3 tools/ci/install_with_hashes.py --requirements requirements-locks/requirements-docs-actions.lock
          python3 tools/ci/install_with_hashes.py --requirements requirements-locks/requirements-web-docs.lock

      - name: Manifest + docs references gate
        env:
          YOLOZU_REQUIRE_REAL_COCO: "1"
        run: |
          python tools/validate_tool_manifest.py --manifest tools/manifest.json --require-declarative
          python tools/audit_docs_examples_drift.py --json
          python tools/generate_adaptive_vision_roadmap.py --check --json
          python tools/generate_benchmark_support_matrix.py --check --json
          python tools/generate_web_docs.py --check --json
          python -m unittest \
            tests.test_adaptive_vision_roadmap_generator \
            tests.test_adaptive_evidence_contracts \
            tests.test_schema_governance \
            tests.test_packaged_tools_manifest \
            tests.test_manifest_docs_references -v
          python -m unittest tests.test_byop_quickstarts -v
          python -m unittest \
            tests.test_web_docs_generation \
            tests.test_web_docs_candidate_wheel -v

      - name: MCP/actions smoke
        run: |
          python3 tools/run_mcp_server.py --help
          python3 tools/run_mcp_server.py --sample-generate-config > reports/ai_generate_config_ci.json
          python3 tools/run_mcp_server.py --sample-review-config reports/ai_generate_config_ci.json
          python3 tools/run_actions_api.py --help
          python3 tools/check_mcp_settings.py --output reports/mcp_settings_check_ci.json

      - name: MCP-focused tests
        run: |
          python -c "import mcp, setuptools"
          python -m unittest \
            tests.test_ai_first_mcp_surface \
            tests.test_candidate_artifact_ai_surface \
            tests.test_installed_ai_surface \
            tests.test_mcp_live_surface \
            tests.test_predictions_validation_json \
            tests.test_integrations_mcp_actions_parity \
            tests.test_check_mcp_settings_tool \
            tests.test_generated_integration_tool_reference -v

  ai_contract_gate:
    name: "AI/API installed-artifact contract"
    needs:
      - changes
    if: ${{ needs.changes.outputs.full_ci == 'true' || needs.changes.outputs.docs_mcp_ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install hash-locked MCP/Actions test dependencies
        run: |
          python3 tools/ci/install_with_hashes.py --requirements requirements-locks/requirements-docs-actions.lock
          python -c "import mcp, setuptools"

      - name: Candidate artifact, live schema, and packaged-copy gates
        run: |
          python -m unittest \
            tests.test_candidate_artifact_ai_surface \
            tests.test_installed_ai_surface \
            tests.test_mcp_live_surface \
            tests.test_predictions_validation_json \
            tests.test_ai_first_mcp_surface \
            tests.test_integrations_mcp_actions_parity \
            tests.test_generated_integration_tool_reference \
            tests.test_interface_contract_terminology \
            tests.test_adaptive_vision_roadmap_generator \
            tests.test_packaged_tools_manifest \
            tests.test_manifest_docs_references -v

      - name: Assert contract tests do not mutate tracked SSOT copies
        run: |
          git diff --exit-code -- \
            tools/manifest.json \
            yolozu/data/manifest/tools_manifest.json \
            yolozu/data/manifest/adaptive_vision_roadmap.json \
            docs/schemas/adaptive_vision_roadmap.schema.json \
            yolozu/data/schemas/adaptive_vision_roadmap.schema.json \
            reports/adaptive_vision_roadmap.md \
            docs/schemas/predictions_validation_result.schema.json \
            yolozu/data/schemas/predictions_validation_result.schema.json \
            docs/generated/mcp_actions_tool_reference.json \
            docs/generated/mcp_actions_tool_reference.md \
            yolozu/data/integrations/mcp_actions_tool_reference.json

  smoke_gate:
    name: "ci tier: core (runtime smoke)"
    needs:
      - changes
    if: ${{ needs.changes.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install (hash-locked runtime + local wheel)
        run: |
          python3 tools/ci/install_with_hashes.py --requirements requirements-locks/requirements-runtime.lock --install-local-wheel

      - name: README smoke script
        run: |
          bash scripts/smoke.sh

  quality_gate:
    name: "ci tier: recommended (ruff + focused pytest)"
    needs:
      - changes
      - smoke_gate
    if: ${{ needs.changes.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install deps (hash-locked recommended tier)
        run: |
          python3 tools/ci/install_with_hashes.py --requirements requirements-locks/requirements-ci.lock

      - name: Ruff (focused paths)
        run: |
          ruff check tools yolozu tests

      - name: Focused pytest (YOLO26 quality)
        run: |
          pytest -q \
            tests/test_eval_suite_export_settings.py \
            tests/test_eval_suite_determinism.py \
            tests/test_check_map_targets_contract.py \
            tests/test_yolo26_protocol.py \
            tests/test_predictions.py \
            tests/test_manifest_docs_references.py \
            tests/test_docs_examples_drift.py \
            tests/test_generated_cli_reference.py \
            tests/test_ssot_capability_coverage.py \
            tests/test_adaptive_vision_roadmap_generator.py \
            tests/test_benchmark_support_matrix_generator.py \
            tests/test_backend_shape_format_contracts.py \
            tests/test_external_inference_templates_smoke.py \
            tests/test_byop_quickstarts.py \
            tests/test_support_external_training_tool.py \
            tests/test_ai_first_mcp_surface.py

      - name: Installed candidate TTT/CTTA contract
        env:
          YOLOZU_REQUIRE_TTT_CANDIDATE: "1"
        run: |
          python -m unittest \
            tests.test_candidate_artifact_ai_surface \
            tests.test_integrations_ttt_jobs -v

      - name: Web docs contract and candidate-wheel journey
        env:
          YOLOZU_REQUIRE_REAL_COCO: "1"
        run: |
          python3 tools/ci/install_with_hashes.py --requirements requirements-locks/requirements-web-docs.lock
          python tools/generate_web_docs.py --check --json
          python -m unittest \
            tests.test_web_docs_generation \
            tests.test_web_docs_candidate_wheel -v

      - name: Smoke walkthrough (deep, offline)
        run: |
          bash scripts/smoke.sh --profile deep --torch-device cpu

      - name: MCP/AI surface smoke
        run: |
          python3 tools/run_mcp_server.py --help
          python3 tools/run_mcp_server.py --sample-generate-config > reports/ai_generate_config_ci.json
          python3 tools/run_mcp_server.py --sample-review-config reports/ai_generate_config_ci.json
          python3 tools/run_actions_api.py --help

  pip_smoke:
    name: "ci tier: core (pip smoke, py${{ matrix.python-version }})"
    needs:
      - changes
      - smoke_gate
    if: ${{ needs.changes.outputs.full_ci == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (hash-locked runtime + local wheel)
        run: |
          python3 tools/ci/install_with_hashes.py --requirements requirements-locks/requirements-runtime.lock --install-local-wheel

      - name: Repo smoke script (offline dry-run path)
        run: |
          bash scripts/smoke.sh

      - name: CLI smoke (doctor + demo)
        run: |
          yolozu doctor --output -
          yolozu demo instance-seg --num-images 2 --image-size 48 --max-instances 2 --run-dir "${RUNNER_TEMP}/yolozu_demo"

  test:
    name: "ci tier: recommended (full gate suite)"
    needs: [changes, smoke_gate, quality_gate]
    if: ${{ needs.changes.outputs.full_ci == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install deps (hash-locked recommended tier)
        run: |
          python3 tools/ci/install_with_hashes.py --requirements requirements-locks/requirements-ci.lock

      - name: Packaging smoke (hash-locked local wheel + yolozu doctor)
        run: |
          python3 tools/ci/install_with_hashes.py --requirements requirements-locks/requirements-runtime.lock --install-local-wheel
          yolozu doctor --output -
          yolozu export --help
          python -c "from yolozu import resources; paths = resources.list_resource_paths(); assert 'schemas/predictions.schema.json' in paths; assert 'schemas/adaptive_vision_roadmap.schema.json' in paths; assert 'manifest/adaptive_vision_roadmap.json' in paths; assert 'protocols/yolo26_eval.json' in paths; print('resources OK:', len(paths))"

      - name: Install build tooling (hash-locked)
        run: |
          python3 tools/ci/install_with_hashes.py --requirements requirements-locks/requirements-build.lock

      - name: Wheel contents gate (schemas/protocols/minimal docs)
        run: |
          python -m build --wheel
          python - <<'PY'
          import glob
          import sys
          import zipfile

          wheels = sorted(glob.glob("dist/*.whl"))
          if not wheels:
            raise SystemExit("no wheels found in dist/")
          whl = wheels[-1]

          with zipfile.ZipFile(whl, "r") as z:
            names = set(z.namelist())

          required = [
            "yolozu/data/schemas/adaptive_vision_roadmap.schema.json",
            "yolozu/data/schemas/predictions.schema.json",
            "yolozu/data/protocols/yolo26_eval.json",
            "yolozu/data/manifest/tools_manifest.json",
            "yolozu/data/manifest/adaptive_vision_roadmap.json",
            "yolozu/data/docs/README.md",
            "yolozu/data/docs/proof_onepager.md",
            "yolozu/data/docs/backend_parity_matrix.md",
            "yolozu/data/docs/onnx_export_parity.md",
            "yolozu/data/docs/tensorrt_pipeline.md",
            "yolozu/data/docs/yolo26_baseline_repro.md",
            "yolozu/data/docs/tta_support_matrix.md",
            "yolozu/data/docs/adapter_strategy.md",
          ]

          missing = [p for p in required if p not in names]
          if missing:
            print("wheel:", whl)
            print("missing:")
            for p in missing:
              print(" -", p)
            sys.exit(1)

          print("wheel contents OK:", whl)
          PY

      - name: Sdist contents gate (schemas/protocols/docs/manifest)
        run: |
          python -m build --sdist
          python - <<'PY'
          import glob
          import tarfile
          import sys

          sdist_files = sorted(glob.glob("dist/*.tar.gz"))
          if not sdist_files:
            raise SystemExit("no sdist found in dist/")
          sdist = sdist_files[-1]

          required = [
            "LICENSE",
            "NOTICE",
            "COPYRIGHT",
            "SECURITY.md",
            "RELEASE.md",
            "tools/manifest.json",
            "yolozu/data/schemas/adaptive_vision_roadmap.schema.json",
            "yolozu/data/schemas/predictions.schema.json",
            "yolozu/data/protocols/yolo26_eval.json",
            "yolozu/data/manifest/tools_manifest.json",
            "yolozu/data/manifest/adaptive_vision_roadmap.json",
            "yolozu/data/docs/README.md",
            "yolozu/data/docs/proof_onepager.md",
            "yolozu/data/docs/backend_parity_matrix.md",
            "yolozu/data/docs/onnx_export_parity.md",
            "yolozu/data/docs/tensorrt_pipeline.md",
            "yolozu/data/docs/yolo26_baseline_repro.md",
            "yolozu/data/docs/tta_support_matrix.md",
            "yolozu/data/docs/adapter_strategy.md",
          ]

          with tarfile.open(sdist, "r:gz") as tf:
            names = tf.getnames()

          def has_suffix(path_suffix: str) -> bool:
            suffix = "/" + path_suffix
            return any(name.endswith(suffix) for name in names)

          missing = [path for path in required if not has_suffix(path)]
          if missing:
            print("sdist:", sdist)
            print("missing:")
            for path in missing:
              print(" -", path)
            sys.exit(1)

          print("sdist contents OK:", sdist)
          PY

      - name: License policy
        run: |
          python tools/check_license_policy.py

      - name: Lint
        run: |
          ruff check .

      - name: Manifest declarative completeness gate
        run: |
          python tools/validate_tool_manifest.py --manifest tools/manifest.json --require-declarative

      - name: Manifest sync gate (tools -> packaged copy)
        run: |
          python tools/sync_tools_manifest.py
          git diff --exit-code -- tools/manifest.json yolozu/data/manifest/tools_manifest.json

      - name: Advisory audit (yolozu flags vs manifest)
        continue-on-error: true
        run: |
          python tools/audit_yolozu_manifest_flags.py

      - name: Reference adapter micro gate - interface contract (hard)
        run: |
          python tools/run_reference_adapter_regression.py \
            --dataset data/smoke \
            --split val \
            --max-images 2 \
            --profile micro \
            --device cpu \
            --image-size 160 \
            --score-threshold 0.05 \
            --max-detections 20 \
            --init-seed 2026 \
            --repro-policy relaxed \
            --capture-provenance minimal \
            --score-gate-mode off \
            --perf-gate-mode off \
            --runtime-lock requirements-locks/requirements-ci.lock \
            --enforce-runtime-lock \
            --enforce-weights-hash \
            --baseline baselines/reference_adapter/rtdetr_pose_smoke_val.json \
            --output reports/reference_adapter_regression_contract_ci.json

      - name: Reference adapter micro gate - behavior (warn)
        run: |
          python tools/run_reference_adapter_regression.py \
            --dataset data/smoke \
            --split val \
            --max-images 2 \
            --profile micro \
            --device cpu \
            --image-size 160 \
            --score-threshold 0.05 \
            --max-detections 20 \
            --init-seed 2026 \
            --repro-policy relaxed \
            --capture-provenance minimal \
            --schema-gate-mode off \
            --consistency-gate-mode off \
            --score-gate-mode warn \
            --perf-gate-mode warn \
            --runtime-lock requirements-locks/requirements-ci.lock \
            --enforce-runtime-lock \
            --baseline baselines/reference_adapter/rtdetr_pose_smoke_val.json \
            --output reports/reference_adapter_regression_behavior_ci.json

      - name: Reference adapter fixed real scenario smoke (write/check)
        run: |
          # CI does not ship real images in git; prepare a tiny real-image few-shot dataset deterministically.
          python tools/prepare_real_multitask_fewshot.py \
            --out data/real_multitask_fewshot \
            --train-images 1 \
            --val-images 1 \
            --download-if-missing \
            --allow-auto-download \
            --accept-dataset-license \
            --download-num-images 2 \
            --download-seed 0 \
            --strict-provenance \
            --force
          baseline_path="reports/reference_adapter_real_multitask_micro_baseline_ci.json"
          python tools/run_reference_adapter_regression.py \
            --dataset data/real_multitask_fewshot \
            --split val \
            --max-images 1 \
            --profile micro \
            --device cpu \
            --image-size 160 \
            --score-threshold 0.05 \
            --max-detections 20 \
            --init-seed 2026 \
            --repro-policy relaxed \
            --capture-provenance minimal \
            --score-gate-mode off \
            --perf-gate-mode off \
            --runtime-lock requirements-locks/requirements-ci.lock \
            --enforce-runtime-lock \
            --baseline "${baseline_path}" \
            --write-baseline \
            --output reports/reference_adapter_regression_real_scenario_baseline_write_ci.json
          python tools/run_reference_adapter_regression.py \
            --dataset data/real_multitask_fewshot \
            --split val \
            --max-images 1 \
            --profile micro \
            --device cpu \
            --image-size 160 \
            --score-threshold 0.05 \
            --max-detections 20 \
            --init-seed 2026 \
            --repro-policy relaxed \
            --capture-provenance minimal \
            --score-gate-mode off \
            --perf-gate-mode off \
            --runtime-lock requirements-locks/requirements-ci.lock \
            --enforce-runtime-lock \
            --baseline "${baseline_path}" \
            --output reports/reference_adapter_regression_real_scenario_ci.json

      - name: Unit tests
        run: |
          python -m unittest discover -s tests -t tests
