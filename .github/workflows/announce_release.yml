name: announce_release

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: announce-release-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install announce deps (isolated)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "requests==2.32.3" "requests-oauthlib==2.0.0" "praw==7.8.1"

      - name: Generate announcement bundle (always)
        run: |
          python tools/announce_release.py --out-dir reports/announce

      - name: Post (only if secrets configured)
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_REFRESH_TOKEN: ${{ secrets.REDDIT_REFRESH_TOKEN }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          YOLOZU_REDDIT_SUBREDDIT: ${{ vars.YOLOZU_REDDIT_SUBREDDIT }}
          YOLOZU_REDDIT_KIND: ${{ vars.YOLOZU_REDDIT_KIND }}
        run: |
          python tools/announce_release.py --out-dir reports/announce --post --strict-post

      - name: Upload bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release_announcement_bundle
          path: reports/announce

