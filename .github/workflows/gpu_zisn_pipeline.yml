name: gpu-zisn-pipeline

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "GPU validation stage to run"
        type: choice
        required: true
        default: all
        options:
          - all
          - zisn1
          - zisn2
          - zisn3

permissions:
  actions: read
  contents: read

concurrency:
  group: gpu-zisn-${{ github.ref }}-${{ github.event.inputs.stage }}
  cancel-in-progress: true

jobs:
  zisn1_train_ort:
    if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'zisn1' }}
    runs-on: [machine, gpu=t4]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: GPU visible
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi

      - name: RT-DETR pose train + ONNX + ORT CUDA parity
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            echo "docker not found; cannot run gpu-zisn stage."
            exit 1
          fi

          docker pull runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04

          docker run --rm --gpus all \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04 \
            bash /workspace/tools/ci/run_gpu_zisn1.sh

      - name: Upload zisn1 artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zisn1-artifacts
          if-no-files-found: ignore
          path: |
            reports/ci_zisn1/**

  zisn2_trt:
    if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'zisn2' }}
    runs-on: [machine, gpu=t4]
    timeout-minutes: 75
    env:
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download zisn1 artifacts (optional)
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zisn1-artifacts
          path: .tmp_zisn1

      - name: TensorRT build/export/parity/eval/latency
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi

          if [[ -z "${NGC_API_KEY:-}" ]]; then
            echo "NGC_API_KEY is not configured; skipping zisn2 TensorRT stage."
            mkdir -p reports/ci_zisn2
            echo "missing NGC_API_KEY" > reports/ci_zisn2/skip_reason.txt
            exit 0
          fi

          set +x
          echo "${NGC_API_KEY}" | docker login nvcr.io -u '$oauthtoken' --password-stdin
          set -x
          docker pull nvcr.io/nvidia/tensorrt:24.08-py3

          docker run --rm --gpus all \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            nvcr.io/nvidia/tensorrt:24.08-py3 \
            bash /workspace/tools/ci/run_gpu_zisn2.sh

      - name: Upload zisn2 artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zisn2-artifacts
          if-no-files-found: ignore
          path: |
            reports/ci_zisn2/**

  zisn3_opencv_ttt:
    if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'zisn3' }}
    runs-on: [machine, gpu=t4]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download zisn1 artifacts (optional)
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zisn1-artifacts
          path: .tmp_zisn1

      - name: OpenCV-DNN parity + Safe TTT/CTTA stability
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi

          if ! command -v docker >/dev/null 2>&1; then
            echo "docker not found; cannot run gpu-zisn stage."
            exit 1
          fi

          docker pull runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04

          docker run --rm --gpus all \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04 \
            bash /workspace/tools/ci/run_gpu_zisn3.sh

      - name: Upload zisn3 artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zisn3-artifacts
          if-no-files-found: ignore
          path: |
            reports/ci_zisn3/**

  publish_logs:
    needs: [zisn1_train_ort, zisn2_trt, zisn3_opencv_ttt]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      CI_LOGS_PUSH_TOKEN: ${{ secrets.CI_LOGS_PUSH_TOKEN }}
      LOG_BRANCH: ci-logs/gpu-zisn
      STAGE: ${{ github.event.inputs.stage }}
      ZISN1_RESULT: ${{ needs.zisn1_train_ort.result }}
      ZISN2_RESULT: ${{ needs.zisn2_trt.result }}
      ZISN3_RESULT: ${{ needs.zisn3_opencv_ttt.result }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download zisn1 artifacts
        if: ${{ needs.zisn1_train_ort.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zisn1-artifacts
          path: .tmp_zisn1

      - name: Download zisn2 artifacts
        if: ${{ needs.zisn2_trt.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zisn2-artifacts
          path: .tmp_zisn2

      - name: Download zisn3 artifacts
        if: ${{ needs.zisn3_opencv_ttt.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zisn3-artifacts
          path: .tmp_zisn3

      - name: Build summary artifacts
        shell: bash
        run: |
          set -euo pipefail
          out_dir=".tmp_gpu_zisn_summary"
          mkdir -p "${out_dir}/ci_gpu_zisn"

          if [[ -d .tmp_zisn1/reports/ci_zisn1 ]]; then
            cp -a .tmp_zisn1/reports/ci_zisn1 "${out_dir}/ci_gpu_zisn/zisn1" || true
          elif [[ -d .tmp_zisn1/ci_zisn1 ]]; then
            cp -a .tmp_zisn1/ci_zisn1 "${out_dir}/ci_gpu_zisn/zisn1" || true
          elif [[ -d .tmp_zisn1 ]]; then
            cp -a .tmp_zisn1 "${out_dir}/ci_gpu_zisn/zisn1" || true
          fi
          if [[ -d .tmp_zisn2/reports/ci_zisn2 ]]; then
            cp -a .tmp_zisn2/reports/ci_zisn2 "${out_dir}/ci_gpu_zisn/zisn2" || true
          elif [[ -d .tmp_zisn2/ci_zisn2 ]]; then
            cp -a .tmp_zisn2/ci_zisn2 "${out_dir}/ci_gpu_zisn/zisn2" || true
          elif [[ -d .tmp_zisn2 ]]; then
            cp -a .tmp_zisn2 "${out_dir}/ci_gpu_zisn/zisn2" || true
          fi
          if [[ -d .tmp_zisn3/reports/ci_zisn3 ]]; then
            cp -a .tmp_zisn3/reports/ci_zisn3 "${out_dir}/ci_gpu_zisn/zisn3" || true
          elif [[ -d .tmp_zisn3/ci_zisn3 ]]; then
            cp -a .tmp_zisn3/ci_zisn3 "${out_dir}/ci_gpu_zisn/zisn3" || true
          elif [[ -d .tmp_zisn3 ]]; then
            cp -a .tmp_zisn3 "${out_dir}/ci_gpu_zisn/zisn3" || true
          fi

          rm -f "${out_dir}/ci_gpu_zisn/zisn2/"*.plan "${out_dir}/ci_gpu_zisn/zisn2/"*.engine 2>/dev/null || true
          rm -f "${out_dir}/ci_gpu_zisn/zisn3/"*.plan "${out_dir}/ci_gpu_zisn/zisn3/"*.engine 2>/dev/null || true

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          stage = os.environ.get("STAGE", "all")
          zisn1_result = os.environ.get("ZISN1_RESULT", "")
          zisn2_result = os.environ.get("ZISN2_RESULT", "")
          zisn3_result = os.environ.get("ZISN3_RESULT", "")
          root = Path(".tmp_gpu_zisn_summary/ci_gpu_zisn")

          opencv_cuda_status = {}
          opencv_cuda_status_path = root / "zisn3" / "opencv_cuda_status.json"
          if opencv_cuda_status_path.is_file():
              try:
                  opencv_cuda_status = json.loads(opencv_cuda_status_path.read_text(encoding="utf-8"))
              except Exception:
                  opencv_cuda_status = {}

          checks = {
              "zisn1_model_onnx": (root / "zisn1" / "model.onnx").is_file(),
              "zisn1_model_meta": (root / "zisn1" / "model.onnx.meta.json").is_file(),
              "zisn1_ort_cuda_check": (root / "zisn1" / "ort_cuda_provider_check.json").is_file(),
              "zisn2_engine_meta": (root / "zisn2" / "engine.meta.json").is_file(),
              "zisn2_pred_trt": (root / "zisn2" / "pred_trt.json").is_file(),
              "zisn2_parity_report": (root / "zisn2" / "parity_trt_vs_onnxrt.json").is_file(),
              "zisn2_latency": (root / "zisn2" / "latency_trt.json").is_file(),
              "zisn2_eval": (root / "zisn2" / "eval_trt.json").is_file(),
              "zisn3_opencv_cpu_pred": (root / "zisn3" / "pred_opencv_cpu.json").is_file(),
              "zisn3_opencv_cpu_meta": (root / "zisn3" / "pred_opencv_cpu.meta.json").is_file(),
              "zisn3_opencv_cuda_status": (root / "zisn3" / "opencv_cuda_status.json").is_file(),
              "zisn3_ttt_summary": (root / "zisn3" / "ttt_stability_summary.json").is_file(),
              "zisn3_doctor": (root / "zisn3" / "doctor_gpu.json").is_file(),
              "zisn3_ttt_tent_log": (root / "zisn3" / "ttt_tent.log.json").is_file(),
              "zisn3_ttt_cotta_log": (root / "zisn3" / "ttt_cotta.log.json").is_file(),
              "zisn3_ttt_eata_log": (root / "zisn3" / "ttt_eata.log.json").is_file(),
              "zisn3_ttt_sar_log": (root / "zisn3" / "ttt_sar.log.json").is_file(),
              "zisn3_opencv_cuda_pred": (root / "zisn3" / "pred_opencv_cuda.json").is_file(),
              "zisn3_opencv_cuda_meta": (root / "zisn3" / "pred_opencv_cuda.meta.json").is_file(),
              "zisn3_opencv_parity": (root / "zisn3" / "parity_opencv_cpu_vs_cuda.json").is_file(),
          }

          required = []
          if stage in ("all", "zisn1"):
              required.extend(["zisn1_model_onnx", "zisn1_model_meta", "zisn1_ort_cuda_check"])
          if stage in ("all", "zisn2"):
              required.extend(["zisn2_engine_meta", "zisn2_pred_trt", "zisn2_parity_report", "zisn2_latency", "zisn2_eval"])
          if stage in ("all", "zisn3"):
              required.extend(
                  [
                      "zisn3_opencv_cpu_pred",
                      "zisn3_opencv_cpu_meta",
                      "zisn3_opencv_cuda_status",
                      "zisn3_ttt_summary",
                      "zisn3_doctor",
                      "zisn3_ttt_tent_log",
                      "zisn3_ttt_cotta_log",
                      "zisn3_ttt_eata_log",
                      "zisn3_ttt_sar_log",
                  ]
              )
              if str(opencv_cuda_status.get("status")) == "ok":
                  required.extend(
                      [
                          "zisn3_opencv_cuda_pred",
                          "zisn3_opencv_cuda_meta",
                          "zisn3_opencv_parity",
                      ]
                  )

          missing = [k for k in required if not checks.get(k)]
          if missing:
              dod_status = "fail"
          elif (stage in ("all", "zisn1") and zisn1_result != "success") or (
              stage in ("all", "zisn2") and zisn2_result != "success"
          ) or (
              stage in ("all", "zisn3") and zisn3_result != "success"
          ):
              dod_status = "fail"
          elif not required:
              dod_status = "skip"
          else:
              dod_status = "pass"

          run_info = {
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "ref": os.environ.get("GITHUB_REF"),
              "sha": os.environ.get("GITHUB_SHA"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "job": os.environ.get("GITHUB_JOB"),
              "actor": os.environ.get("GITHUB_ACTOR"),
              "stage": stage,
              "zisn1_result": zisn1_result,
              "zisn2_result": zisn2_result,
              "zisn3_result": zisn3_result,
          }

          summary = {
              "schema_version": 1,
              "dod_status": dod_status,
              "run_info": run_info,
              "checks": checks,
              "missing_required_artifacts": missing,
          }

          summary_path = root / "dod_summary.json"
          summary_path.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")

          lines = [
              "# gpu-zisn DoD summary",
              "",
              f"- stage: `{stage}`",
              f"- dod_status: `{dod_status}`",
              f"- zisn1_result: `{zisn1_result}`",
              f"- zisn2_result: `{zisn2_result}`",
              f"- zisn3_result: `{zisn3_result}`",
              "",
              "## checks",
          ]
          for key, ok in checks.items():
              lines.append(f"- {key}: {'ok' if ok else 'missing'}")
          if missing:
              lines.append("")
              lines.append("## missing_required_artifacts")
              for key in missing:
                  lines.append(f"- {key}")

          (root / "dod_summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          (root / "run_info.json").write_text(json.dumps(run_info, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Publish logs branch
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CI_LOGS_PUSH_TOKEN:-}" ]]; then
            echo "CI_LOGS_PUSH_TOKEN is not configured; skipping log-branch publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan "${LOG_BRANCH}"
          git rm -rf . >/dev/null 2>&1 || true

          mkdir -p ci_logs
          cp -a .tmp_gpu_zisn_summary/ci_gpu_zisn ci_logs/ci_gpu_zisn
          git add ci_logs

          if git diff --cached --quiet; then
            echo "No gpu-zisn log changes to publish."
            exit 0
          fi

          git commit -m "gpu-zisn logs ${GITHUB_RUN_ID} (${GITHUB_SHA})"
          remote_url="https://x-access-token:${CI_LOGS_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f "${remote_url}" "${LOG_BRANCH}"

      - name: Upload gpu-zisn summary artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gpu-zisn-summary
          if-no-files-found: ignore
          path: |
            .tmp_gpu_zisn_summary/ci_gpu_zisn/**
