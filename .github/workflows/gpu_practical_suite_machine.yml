name: gpu-practical-suite-machine

on:
  workflow_dispatch:

concurrency:
  group: gpu-practical-suite-machine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  practical_suite:
    runs-on: [machine, gpu=t4]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: GPU visible
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi

      - name: Multitask finetune demo (CUDA, real images)
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            echo "docker not found; cannot run CUDA practical suite."
            exit 1
          fi

          image="runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04"
          docker pull "${image}"

          docker run --rm --gpus all \
            -e GITHUB_SHA \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            "${image}" \
            bash -lc '
              set -euo pipefail
              nvidia-smi
              python3 --version

              if command -v git >/dev/null 2>&1; then
                git config --global --add safe.directory /workspace || true
              fi

              python3 tools/ci/install_with_hashes.py --requirements requirements-locks/requirements-runtime.lock --install-local-wheel

              # GPU smoke walkthrough (offline). Exercises CUDA TTT probe via --torch-device.
              bash scripts/smoke.sh --profile deep --torch-device cuda

              # Prepare a tiny real-image few-shot dataset deterministically.
              python3 tools/prepare_real_multitask_fewshot.py \
                --out data/real_multitask_fewshot \
                --train-images 2 \
                --val-images 1 \
                --download-if-missing \
                --allow-auto-download \
                --accept-dataset-license \
                --download-num-images 3 \
                --download-seed 0 \
                --strict-provenance \
                --force

              # Run micro finetune across tasks on CUDA.
              python3 tools/run_real_multitask_finetune_demo.py \
                --dataset-root data/real_multitask_fewshot \
                --out reports/gpu_practical_finetune_demo \
                --device cuda \
                --epochs 1 \
                --max-steps 5 \
                --batch-size 2 \
                --image-size 128 \
                --strict-provenance \
                --force

              ls -la reports/gpu_practical_finetune_demo || true
            '

      - name: Qualify pinned YOLOX and OpenMMLab runtimes
        id: external
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          image="pytorch/pytorch:2.1.2-cuda12.1-cudnn8-devel"
          docker pull "${image}"
          set +e
          docker run --rm --gpus all \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            "${image}" \
            bash -lc "apt-get update && apt-get install -y --no-install-recommends \
              git libgl1 libglib2.0-0 libsm6 libxext6 libxrender1 libxcb1 && \
              bash scripts/run_external_runtime_gpu_qualification.sh \
              --output-dir reports/compatible_host_external_runtimes \
              --dataset-root data/real_multitask_fewshot"
          status=$?
          set -e
          sudo chown -R "$(id -u):$(id -g)" reports/compatible_host_external_runtimes
          exit "${status}"

      - name: Qualify pinned NVIDIA TAO runtime
        id: tao
        continue-on-error: true
        shell: bash
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${NGC_API_KEY:-}" ]]; then
            echo "NGC_API_KEY is unavailable" >&2
            exit 1
          fi
          set +x
          echo "${NGC_API_KEY}" | docker login nvcr.io -u '$oauthtoken' --password-stdin
          set -x
          image="nvcr.io/nvidia/tao/tao-toolkit:5.5.0-pyt"
          docker pull "${image}"
          image_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${image}")"
          mkdir -p reports/compatible_host_external_runtimes/tao
          started_epoch="$(date +%s)"
          set +e
          docker run --rm --gpus all \
            -v "${{ github.workspace }}/reports/compatible_host_external_runtimes/datasets/detection:/data" \
            -v "${{ github.workspace }}/configs/examples/finetune_external/tao_dino_runtime_smoke.yaml:/spec.yaml:ro" \
            -v "${{ github.workspace }}/reports/compatible_host_external_runtimes/tao:/results" \
            "${image}" \
            dino train -e /spec.yaml
          status=$?
          set -e
          sudo chown -R "$(id -u):$(id -g)" reports/compatible_host_external_runtimes
          if [[ "${status}" -eq 0 ]]; then
            TAO_IMAGE="${image}" \
              TAO_IMAGE_DIGEST="${image_digest}" \
              TAO_STARTED_EPOCH="${started_epoch}" \
              python3 - <<'PY'
          import hashlib
          import json
          import os
          import time
          from pathlib import Path

          status_path = Path("reports/compatible_host_external_runtimes/tao/status.json")
          records = [
              json.loads(line)
              for line in status_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          failed = any(record.get("status") == "FAILURE" for record in records)
          finished = bool(
              records
              and (
                  records[-1].get("status") == "SUCCESS"
                  or records[-1].get("message") == "Train finished successfully."
              )
          )
          if failed or not finished:
              raise SystemExit("TAO did not report successful training completion")
          checkpoints = sorted(
              path
              for path in status_path.parent.rglob("*")
              if path.is_file() and path.suffix in {".pth", ".pt"}
          )
          if not checkpoints:
              raise SystemExit("TAO reported SUCCESS without a checkpoint")
          checkpoint = checkpoints[-1]
          evidence = {
              "schema_version": 1,
              "kind": "tao_compatible_host_runtime_evidence",
              "image": os.environ["TAO_IMAGE"],
              "image_digest": os.environ["TAO_IMAGE_DIGEST"],
              "vendor_completion_record": records[-1],
              "wall_seconds": max(
                  0.0, time.time() - float(os.environ["TAO_STARTED_EPOCH"])
              ),
              "checkpoint": {
                  "path": checkpoint.relative_to(status_path.parent).as_posix(),
                  "bytes": checkpoint.stat().st_size,
                  "sha256": hashlib.sha256(checkpoint.read_bytes()).hexdigest(),
              },
          }
          evidence_path = status_path.parent / "runtime_evidence.json"
          evidence_path.write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(evidence_path)
          PY
          fi
          exit "${status}"

      - name: Record compatible-host workflow result
        if: ${{ always() }}
        shell: bash
        env:
          EXTERNAL_OUTCOME: ${{ steps.external.outcome }}
          TAO_OUTCOME: ${{ steps.tao.outcome }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("reports/compatible_host_external_runtimes")
          root.mkdir(parents=True, exist_ok=True)
          files = []
          for path in sorted(item for item in root.rglob("*") if item.is_file()):
              files.append(
                  {
                      "path": path.relative_to(root).as_posix(),
                      "bytes": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
              )
          payload = {
              "schema_version": 1,
              "kind": "compatible_host_external_runtime_workflow",
              "source_commit": os.environ["GITHUB_SHA_VALUE"],
              "open_source_lanes": os.environ["EXTERNAL_OUTCOME"],
              "tao_lane": os.environ["TAO_OUTCOME"],
              "artifacts": files,
          }
          (root / "workflow_summary.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY

      - name: Upload compatible-host evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatible-host-external-runtimes
          if-no-files-found: error
          path: reports/compatible_host_external_runtimes/**

      - name: Enforce compatible-host qualification
        if: ${{ always() }}
        shell: bash
        env:
          EXTERNAL_OUTCOME: ${{ steps.external.outcome }}
          TAO_OUTCOME: ${{ steps.tao.outcome }}
        run: |
          test "${EXTERNAL_OUTCOME}" = "success"
          test "${TAO_OUTCOME}" = "success"

      - name: Upload GPU practical suite artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpu-practical-suite
          if-no-files-found: error
          path: |
            reports/gpu_practical_finetune_demo/**
            data/real_multitask_fewshot/prepare_summary.json
