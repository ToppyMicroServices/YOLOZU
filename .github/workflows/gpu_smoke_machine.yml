name: gpu-smoke-machine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu_smoke:
    # machine.dev provisions a runner. Specify GPU explicitly to avoid CPU machines.
    runs-on: [machine, gpu=t4]
    timeout-minutes: 60
    env:
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: GPU visible
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi

      - name: TensorRT smoke (optional)
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            echo "docker not found; skipping TensorRT smoke."
            exit 0
          fi

          if [[ -z "${NGC_API_KEY:-}" ]]; then
            echo "NGC_API_KEY is not set; skipping TensorRT smoke."
            exit 0
          fi

          set +x
          echo "${NGC_API_KEY}" | docker login nvcr.io -u '$oauthtoken' --password-stdin
          set -x

          docker pull nvcr.io/nvidia/tensorrt:24.08-py3
          docker run --rm --gpus all \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            nvcr.io/nvidia/tensorrt:24.08-py3 \
            bash -lc '
              set -euo pipefail
              nvidia-smi
              python3 --version
              python3 -m pip install --upgrade pip
              python3 -m pip install --no-cache-dir numpy onnx

              out_dir="reports/ci_trt_smoke"
              mkdir -p "${out_dir}"
              onnx_path="${out_dir}/model.onnx"
              engine_path="${out_dir}/model_fp16.plan"
              meta_path="${out_dir}/engine.meta.json"

              ONNX_PATH="${onnx_path}" python3 -c "import os, onnx; from onnx import helper, TensorProto; p=os.environ['ONNX_PATH']; X=helper.make_tensor_value_info('images', TensorProto.FLOAT, [1,3,64,64]); Y=helper.make_tensor_value_info('output0', TensorProto.FLOAT, [1,3,64,64]); node=helper.make_node('Identity', inputs=['images'], outputs=['output0']); graph=helper.make_graph([node], 'identity_graph', [X], [Y]); model=helper.make_model(graph, opset_imports=[helper.make_operatorsetid('', 18)]); onnx.save(model, p); print('wrote', p)"

              python3 tools/build_trt_engine.py \
                --onnx "${onnx_path}" \
                --engine "${engine_path}" \
                --precision fp16 \
                --input-name images \
                --min-shape 1x3x64x64 \
                --opt-shape 1x3x64x64 \
                --max-shape 1x3x64x64 \
                --meta-output "${meta_path}"

              trtexec --loadEngine="${engine_path}" --shapes=images:1x3x64x64 --iterations=1 --warmUp=0 > "${out_dir}/trtexec_load.log"
              ls -la "${out_dir}"
            '
