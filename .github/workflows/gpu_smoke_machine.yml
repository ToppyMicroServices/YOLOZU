name: gpu-smoke-machine

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/gpu_smoke_machine.yml
      - tools/build_trt_engine.py
      - tools/ci/**
      - tools/export_trt.py
      - tools/export_predictions_trt.py
      - tools/measure_trt_latency.py
      - tools/run_trt_pipeline.py

concurrency:
  group: gpu-smoke-machine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  gpu_smoke:
    # machine.dev provisions a runner. Specify GPU explicitly to avoid CPU machines.
    runs-on: [machine, gpu=t4]
    timeout-minutes: 60
    env:
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: GPU visible
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi

      - name: TensorRT smoke (optional)
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            echo "docker not found; skipping TensorRT smoke."
            exit 0
          fi

          if [[ -z "${NGC_API_KEY:-}" ]]; then
            echo "NGC_API_KEY is not set; skipping TensorRT smoke."
            exit 0
          fi

          set +x
          echo "${NGC_API_KEY}" | docker login nvcr.io -u '$oauthtoken' --password-stdin
          set -x

          docker pull nvcr.io/nvidia/tensorrt:24.08-py3
          docker run --rm --gpus all \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            nvcr.io/nvidia/tensorrt:24.08-py3 \
            bash -lc '
              set -euo pipefail
              nvidia-smi
              python3 --version
              if command -v git >/dev/null 2>&1; then
                git config --global --add safe.directory /workspace || true
              fi
              python3 -m pip install --upgrade pip
              python3 -m pip install --no-cache-dir numpy onnx

              out_dir="reports/ci_trt_smoke"
              mkdir -p "${out_dir}"
              onnx_path="${out_dir}/model.onnx"
              engine_path="${out_dir}/model_fp16.plan"
              meta_path="${out_dir}/engine.meta.json"

              python3 tools/ci/gen_identity_onnx.py --out "${onnx_path}" --input-name images --output-name output0 --shape 1x3x64x64 --opset 18

              python3 tools/build_trt_engine.py \
                --onnx "${onnx_path}" \
                --engine "${engine_path}" \
                --precision fp16 \
                --input-name images \
                --min-shape 1x3x64x64 \
                --opt-shape 1x3x64x64 \
                --max-shape 1x3x64x64 \
                --meta-output "${meta_path}" \
                2>&1 | tee "${out_dir}/build_trt_engine.log"

              if trtexec --help 2>&1 | grep -q -- "--warmUp"; then
                trtexec --loadEngine="${engine_path}" --iterations=1 --warmUp=0 > "${out_dir}/trtexec_load.log"
              else
                trtexec --loadEngine="${engine_path}" --iterations=1 > "${out_dir}/trtexec_load.log"
              fi
              ls -la "${out_dir}"
            '

      - name: Upload TRT smoke artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: trt-smoke
          if-no-files-found: ignore
          path: |
            reports/ci_trt_smoke/**

      - name: Publish TRT smoke logs branch
        if: ${{ always() }}
        shell: bash
        env:
          LOG_BRANCH: ci-logs/gpu-smoke-machine
        run: |
          set -euo pipefail

          if ! command -v git >/dev/null 2>&1; then
            echo "git not found; skipping log publish."
            exit 0
          fi

          workdir="$(mktemp -d)"
          mkdir -p "${workdir}/ci_trt_smoke"
          if [[ -d reports/ci_trt_smoke ]]; then
            cp -a reports/ci_trt_smoke/. "${workdir}/ci_trt_smoke/" || true
          fi

          # Never publish large/binary artifacts to git.
          rm -f "${workdir}/ci_trt_smoke/"*.plan "${workdir}/ci_trt_smoke/"*.engine 2>/dev/null || true

          cat > "${workdir}/ci_trt_smoke/run_info.json" <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "ref": "${GITHUB_REF}",
            "sha": "${GITHUB_SHA}",
            "workflow": "${GITHUB_WORKFLOW}",
            "job": "${GITHUB_JOB}",
            "actor": "${GITHUB_ACTOR}"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan "${LOG_BRANCH}"
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p ci_logs
          cp -a "${workdir}/ci_trt_smoke" "ci_logs/ci_trt_smoke"
          git add ci_logs
          git commit -m "gpu-smoke-machine logs ${GITHUB_RUN_ID} (${GITHUB_SHA})"
          git push -f origin "${LOG_BRANCH}"
