name: gpu-smoke-machine

on:
  workflow_dispatch:

concurrency:
  group: gpu-smoke-machine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gpu_smoke:
    # machine.dev provisions a runner. Specify GPU explicitly to avoid CPU machines.
    runs-on: [machine, gpu=t4]
    timeout-minutes: 60
    env:
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: GPU visible
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi

      - name: PyTorch CUDA smoke (optional)
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            echo "docker not found; skipping PyTorch CUDA smoke."
            exit 0
          fi

          image="runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04"
          docker pull "${image}"

          docker run --rm --gpus all \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            "${image}" \
            bash -lc '
              set -euo pipefail
              nvidia-smi
              python3 - <<"PY"
          import torch
          
          print("torch:", torch.__version__)
          print("cuda build:", torch.version.cuda)
          print("cuda available:", torch.cuda.is_available())
          if not torch.cuda.is_available():
              raise SystemExit("CUDA not available in torch")
          print("device:", torch.cuda.get_device_name(0))
          x = torch.randn(1024, 1024, device="cuda")
          y = x @ x
          torch.cuda.synchronize()
          print("matmul ok, mean:", float(y.mean().cpu()))
          PY

              python3 tools/ci/install_with_hashes.py --requirements requirements-locks/requirements-runtime.lock --install-local-wheel
              python3 -m yolozu.cli doctor --output - || true
            '

      - name: TensorRT smoke (optional)
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            echo "docker not found; skipping TensorRT smoke."
            exit 0
          fi

          if [[ -z "${NGC_API_KEY:-}" ]]; then
            echo "NGC_API_KEY is not set; skipping TensorRT smoke."
            exit 0
          fi

          set +x
          echo "${NGC_API_KEY}" | docker login nvcr.io -u '$oauthtoken' --password-stdin
          set -x

          docker pull nvcr.io/nvidia/tensorrt:24.08-py3
          docker run --rm --gpus all \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            nvcr.io/nvidia/tensorrt:24.08-py3 \
            bash -lc '
              set -euo pipefail
              nvidia-smi
              python3 --version
              if command -v git >/dev/null 2>&1; then
                git config --global --add safe.directory /workspace || true
              fi
              python3 tools/ci/install_with_hashes.py --requirements requirements-locks/requirements-trt-tools.lock

              out_dir="reports/ci_trt_smoke"
              mkdir -p "${out_dir}"
              onnx_path="${out_dir}/model.onnx"
              engine_path="${out_dir}/model_fp16.plan"
              meta_path="${out_dir}/engine.meta.json"

              python3 tools/ci/gen_dummy_dets_onnx.py --out "${onnx_path}" --input-name images --output-name output0 --shape 1x3x64x64 --opset 17 --ir-version 11

              python3 tools/build_trt_engine.py \
                --onnx "${onnx_path}" \
                --engine "${engine_path}" \
                --precision fp16 \
                --input-name images \
                --min-shape 1x3x64x64 \
                --opt-shape 1x3x64x64 \
                --max-shape 1x3x64x64 \
                --meta-output "${meta_path}" \
                2>&1 | tee "${out_dir}/build_trt_engine.log"

              python3 tools/measure_trt_latency.py \
                --engine "${engine_path}" \
                --input-name images \
                --shape 1x3x64x64 \
                --iterations 50 \
                --warmup 10 \
                --output "${out_dir}/latency_trt.json"

              python3 tools/ci/gen_smoke_dataset.py --out "${out_dir}/dataset" --split val --hw 48x64

              python3 tools/export_predictions_onnxrt.py \
                --dataset "${out_dir}/dataset" \
                --split val \
                --onnx "${onnx_path}" \
                --input-name images \
                --combined-output output0 \
                --boxes-scale norm \
                --min-score 0.0 \
                --topk 10 \
                --wrap \
                --strict \
                --output "${out_dir}/pred_onnxrt.json"

              python3 tools/export_predictions_trt.py \
                --dataset "${out_dir}/dataset" \
                --split val \
                --engine "${engine_path}" \
                --input-name images \
                --combined-output output0 \
                --boxes-scale norm \
                --min-score 0.0 \
                --topk 10 \
                --wrap \
                --strict \
                --output "${out_dir}/pred_trt.json"

              python3 tools/check_predictions_parity.py \
                --reference "${out_dir}/pred_onnxrt.json" \
                --candidate "${out_dir}/pred_trt.json" \
                --image-size 64 \
                --iou-thresh 0.99 \
                --score-atol 1e-4 \
                --bbox-atol 1e-4 \
                2>&1 | tee "${out_dir}/parity_trt_vs_onnxrt.log"

              if trtexec --help 2>&1 | grep -q -- "--warmUp"; then
                trtexec --loadEngine="${engine_path}" --iterations=1 --warmUp=0 > "${out_dir}/trtexec_load.log"
              else
                trtexec --loadEngine="${engine_path}" --iterations=1 > "${out_dir}/trtexec_load.log"
              fi
              ls -la "${out_dir}"
            '

      - name: Upload TRT smoke artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trt-smoke
          if-no-files-found: ignore
          path: |
            reports/ci_trt_smoke/**

      - name: Publish TRT smoke logs branch
        if: ${{ always() }}
        shell: bash
        env:
          CI_LOGS_PUSH_TOKEN: ${{ secrets.CI_LOGS_PUSH_TOKEN }}
          LOG_BRANCH: ci-logs/gpu-smoke-machine
        run: |
          set -euo pipefail

          if ! command -v git >/dev/null 2>&1; then
            echo "git not found; skipping log publish."
            exit 0
          fi

          if [[ -z "${CI_LOGS_PUSH_TOKEN:-}" ]]; then
            echo "CI_LOGS_PUSH_TOKEN is not configured; skipping log-branch publish."
            exit 0
          fi

          workdir="$(mktemp -d)"
          mkdir -p "${workdir}/ci_trt_smoke"
          if [[ -d reports/ci_trt_smoke ]]; then
            cp -a reports/ci_trt_smoke/. "${workdir}/ci_trt_smoke/" || true
          fi

          # Never publish large/binary artifacts to git.
          rm -f "${workdir}/ci_trt_smoke/"*.plan "${workdir}/ci_trt_smoke/"*.engine 2>/dev/null || true

          cat > "${workdir}/ci_trt_smoke/run_info.json" <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "ref": "${GITHUB_REF}",
            "sha": "${GITHUB_SHA}",
            "workflow": "${GITHUB_WORKFLOW}",
            "job": "${GITHUB_JOB}",
            "actor": "${GITHUB_ACTOR}"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan "${LOG_BRANCH}"
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p ci_logs
          cp -a "${workdir}/ci_trt_smoke" "ci_logs/ci_trt_smoke"
          git add ci_logs
          git commit -m "gpu-smoke-machine logs ${GITHUB_RUN_ID} (${GITHUB_SHA})"
          remote_url="https://x-access-token:${CI_LOGS_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f "${remote_url}" "${LOG_BRANCH}"
