name: reference-adapter-full

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check: compare vs baseline / write: refresh baseline"
        required: false
        default: "check"
        type: choice
        options:
          - check
          - write
      baseline_path:
        description: "Baseline JSON path"
        required: false
        default: "baselines/reference_adapter/rtdetr_pose_smoke_val.json"
        type: string
      max_images:
        description: "Number of images"
        required: false
        default: "2"
        type: string
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  full_regression:
    name: reference adapter full profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.lock

      - name: Run reference adapter full profile
        run: |
          MODE="${{ github.event.inputs.mode || 'check' }}"
          BASELINE="${{ github.event.inputs.baseline_path || 'baselines/reference_adapter/rtdetr_pose_smoke_val.json' }}"
          MAX_IMAGES="${{ github.event.inputs.max_images || '2' }}"
          EXTRA=""
          if [ "$MODE" = "write" ]; then
            EXTRA="--write-baseline"
          fi
          python tools/run_reference_adapter_regression.py \
            --dataset data/smoke \
            --split val \
            --max-images "$MAX_IMAGES" \
            --profile full \
            --device cpu \
            --image-size 160 \
            --score-threshold 0.05 \
            --max-detections 20 \
            --init-seed 2026 \
            --repro-policy strict \
            --capture-provenance full \
            --score-gate-mode hard \
            --perf-gate-mode warn \
            --runtime-lock requirements-ci.lock \
            --enforce-runtime-lock \
            --baseline "$BASELINE" \
            --output reports/reference_adapter_regression_full_ci.json \
            $EXTRA

      - name: Upload regression artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reference-adapter-full
          path: |
            reports/reference_adapter_regression_full_ci.json
