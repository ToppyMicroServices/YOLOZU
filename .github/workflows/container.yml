name: container

on:
  push:
    tags:
      - "v*"
      - "release/v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag to reuse on manual publish runs (for example v4.3.1).
        required: false
        type: string

permissions:
  contents: read

env:
  GHCR_REGISTRY: ghcr.io
  NGC_REGISTRY: nvcr.io
  NGC_NAMESPACE: yolozu

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: yolozu
            dockerfile: deploy/docker/Dockerfile
            title: YOLOZU
            description: YOLOZU CLI + packaged resources (CPU minimal; no torch).
          - image: yolozu-demo
            dockerfile: deploy/docker/Dockerfile.demo
            title: YOLOZU demo
            description: YOLOZU demo image (includes torch extra; CPU OK).
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to NVIDIA NGC (nvcr.io)
        if: ${{ env.NGC_API_KEY != '' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.NGC_REGISTRY }}
          username: $oauthtoken
          password: ${{ env.NGC_API_KEY }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          owner="${owner,,}"
          ghcr_image="${GHCR_REGISTRY}/${owner}/${{ matrix.image }}"
          ngc_image="${NGC_REGISTRY}/${NGC_NAMESPACE}/${{ matrix.image }}"

          ref_type="${{ github.ref_type }}"
          ref_name="${{ github.ref_name }}"
          event_name="${{ github.event_name }}"
          requested_tag="${{ github.event.inputs.release_tag || '' }}"

          sanitize_tag() {
            # Docker tags allow [A-Za-z0-9_.-] only.
            # Map everything else (including '/', '+', spaces) to '-'.
            echo "${1}" \
              | sed -E 's/[^A-Za-z0-9_.-]+/-/g' \
              | sed -E 's/^[^A-Za-z0-9_]+//'
          }

          publish_to_ngc="false"
          if [[ -n "${NGC_API_KEY:-}" && ( "${ref_type}" == "tag" || "${event_name}" == "workflow_dispatch" ) ]]; then
            publish_to_ngc="true"
          fi

          if [[ "${ref_type}" == "tag" ]]; then
            ref="${ref_name}"
          elif [[ "${event_name}" == "workflow_dispatch" && -n "${requested_tag}" ]]; then
            ref="${requested_tag}"
          else
            ref=""
          fi

          if [[ -n "${ref}" ]]; then
            safe_ref="$(sanitize_tag "${ref}")"
            version="${ref#release/}"
            version="${version#v}"
            safe_version="$(sanitize_tag "${version}")"
            if [[ -z "${safe_version}" ]]; then
              safe_version="${safe_ref}"
            fi
            {
              echo "all_tags<<EOF"
              echo "${ghcr_image}:${safe_version}"
              echo "${ghcr_image}:${safe_ref}"
              echo "${ghcr_image}:latest"
              if [[ "${publish_to_ngc}" == "true" ]]; then
                echo "${ngc_image}:${safe_version}"
                echo "${ngc_image}:${safe_ref}"
                echo "${ngc_image}:latest"
              fi
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          else
            short="${GITHUB_SHA::12}"
            {
              echo "all_tags<<EOF"
              echo "${ghcr_image}:sha-${short}"
              if [[ "${publish_to_ngc}" == "true" ]]; then
                echo "${ngc_image}:sha-${short}"
              fi
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.tags.outputs.all_tags }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  runpod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: yolozu-trt
            dockerfile: deploy/runpod/Dockerfile
            title: YOLOZU TRT tools
            description: YOLOZU tooling image for TensorRT/ONNXRuntime exporters (Linux + NVIDIA stack).
          - image: yolozu-rtdetr-pose
            dockerfile: deploy/runpod/Dockerfile.rtdetr_pose
            title: YOLOZU RTDETRPose
            description: YOLOZU RTDETRPose backend suite image (torch + onnxruntime-gpu).
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Skip runpod publish (no NGC key)
        if: ${{ env.NGC_API_KEY == '' }}
        run: echo "NGC_API_KEY is not configured; skipping runpod image publish."

      - name: Set up Buildx
        if: ${{ env.NGC_API_KEY != '' }}
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to NVIDIA NGC (nvcr.io)
        if: ${{ env.NGC_API_KEY != '' }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: nvcr.io
          username: $oauthtoken
          password: ${{ env.NGC_API_KEY }}

      - name: Log in to GHCR
        if: ${{ env.NGC_API_KEY != '' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        if: ${{ env.NGC_API_KEY != '' }}
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          owner="${owner,,}"
          ghcr_image="${GHCR_REGISTRY}/${owner}/${{ matrix.image }}"
          ngc_image="${NGC_REGISTRY}/${NGC_NAMESPACE}/${{ matrix.image }}"

          ref_type="${{ github.ref_type }}"
          ref_name="${{ github.ref_name }}"
          event_name="${{ github.event_name }}"
          requested_tag="${{ github.event.inputs.release_tag || '' }}"

          sanitize_tag() {
            # Docker tags allow [A-Za-z0-9_.-] only.
            # Map everything else (including '/', '+', spaces) to '-'.
            echo "${1}" \
              | sed -E 's/[^A-Za-z0-9_.-]+/-/g' \
              | sed -E 's/^[^A-Za-z0-9_]+//'
          }

          if [[ "${ref_type}" == "tag" ]]; then
            ref="${ref_name}"
          elif [[ "${event_name}" == "workflow_dispatch" && -n "${requested_tag}" ]]; then
            ref="${requested_tag}"
          else
            ref=""
          fi

          if [[ -n "${ref}" ]]; then
            safe_ref="$(sanitize_tag "${ref}")"
            version="${ref#release/}"
            version="${version#v}"
            safe_version="$(sanitize_tag "${version}")"
            if [[ -z "${safe_version}" ]]; then
              safe_version="${safe_ref}"
            fi
            {
              echo "all_tags<<EOF"
              echo "${ghcr_image}:${safe_version}"
              echo "${ghcr_image}:${safe_ref}"
              echo "${ghcr_image}:latest"
              echo "${ngc_image}:${safe_version}"
              echo "${ngc_image}:${safe_ref}"
              echo "${ngc_image}:latest"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          else
            short="${GITHUB_SHA::12}"
            {
              echo "all_tags<<EOF"
              echo "${ghcr_image}:sha-${short}"
              echo "${ngc_image}:sha-${short}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and push
        if: ${{ env.NGC_API_KEY != '' }}
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.tags.outputs.all_tags }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
