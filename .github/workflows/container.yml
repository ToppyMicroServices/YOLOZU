name: container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "release/v*"
    paths:
      - ".github/workflows/container.yml"
      - "deploy/docker/**"
      - "deploy/runpod/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "MANIFEST.in"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: yolozu
            dockerfile: deploy/docker/Dockerfile
            title: YOLOZU
            description: YOLOZU CLI + packaged resources (CPU minimal; no torch).
          - image: yolozu-demo
            dockerfile: deploy/docker/Dockerfile.demo
            title: YOLOZU demo
            description: YOLOZU demo image (includes torch extra; CPU OK).
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          owner="${owner,,}"
          image="${REGISTRY}/${owner}/${{ matrix.image }}"

          ref_type="${{ github.ref_type }}"
          ref_name="${{ github.ref_name }}"

          sanitize_tag() {
            # Docker tags allow [A-Za-z0-9_.-] only.
            # Map everything else (including '/', '+', spaces) to '-'.
            echo "${1}" \
              | sed -E 's/[^A-Za-z0-9_.-]+/-/g' \
              | sed -E 's/^[^A-Za-z0-9_]+//'
          }

          if [[ "${ref_type}" == "tag" ]]; then
            ref="${ref_name}"
            safe_ref="$(sanitize_tag "${ref}")"
            version="${ref#release/}"
            version="${version#v}"
            safe_version="$(sanitize_tag "${version}")"
            if [[ -z "${safe_version}" ]]; then
              safe_version="${safe_ref}"
            fi
            {
              echo "tags<<EOF"
              echo "${image}:${safe_version}"
              echo "${image}:${safe_ref}"
              echo "${image}:latest"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          else
            short="${GITHUB_SHA::12}"
            {
              echo "tags<<EOF"
              echo "${image}:sha-${short}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  runpod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: yolozu-trt
            dockerfile: deploy/runpod/Dockerfile
            title: YOLOZU TRT tools
            description: YOLOZU tooling image for TensorRT/ONNXRuntime exporters (Linux + NVIDIA stack).
          - image: yolozu-rtdetr-pose
            dockerfile: deploy/runpod/Dockerfile.rtdetr_pose
            title: YOLOZU RTDETRPose
            description: YOLOZU RTDETRPose backend suite image (torch + onnxruntime-gpu).
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Skip runpod publish (no NGC key)
        if: ${{ env.NGC_API_KEY == '' }}
        run: echo "NGC_API_KEY is not configured; skipping runpod image publish."

      - name: Set up Buildx
        if: ${{ env.NGC_API_KEY != '' }}
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to NVIDIA NGC (nvcr.io)
        if: ${{ env.NGC_API_KEY != '' }}
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: nvcr.io
          username: $oauthtoken
          password: ${{ env.NGC_API_KEY }}

      - name: Log in to GHCR
        if: ${{ env.NGC_API_KEY != '' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') }}
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        if: ${{ env.NGC_API_KEY != '' }}
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          owner="${owner,,}"
          image="${REGISTRY}/${owner}/${{ matrix.image }}"

          ref_type="${{ github.ref_type }}"
          ref_name="${{ github.ref_name }}"

          sanitize_tag() {
            # Docker tags allow [A-Za-z0-9_.-] only.
            # Map everything else (including '/', '+', spaces) to '-'.
            echo "${1}" \
              | sed -E 's/[^A-Za-z0-9_.-]+/-/g' \
              | sed -E 's/^[^A-Za-z0-9_]+//'
          }

          if [[ "${ref_type}" == "tag" ]]; then
            ref="${ref_name}"
            safe_ref="$(sanitize_tag "${ref}")"
            version="${ref#release/}"
            version="${version#v}"
            safe_version="$(sanitize_tag "${version}")"
            if [[ -z "${safe_version}" ]]; then
              safe_version="${safe_ref}"
            fi
            {
              echo "tags<<EOF"
              echo "${image}:${safe_version}"
              echo "${image}:${safe_ref}"
              echo "${image}:latest"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          else
            short="${GITHUB_SHA::12}"
            {
              echo "tags<<EOF"
              echo "${image}:sha-${short}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and push
        if: ${{ env.NGC_API_KEY != '' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
